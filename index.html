<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Music Adventure</title>
<style>
  :root{
    --bg1:#6a5cff; --bg2:#ff5ca8; --card:#ffffff; --ink:#2a2350; --muted:#6b6690;
    --pink:#ff5ca8; --purple:#7c5cff; --blue:#39c0ff; --green:#38d39f; --yellow:#ffd23f;
    --orange:#ff9d3c; --red:#ff6b6b; --shadow:0 10px 0 rgba(0,0,0,.12), 0 18px 30px rgba(0,0,0,.18);
    --radius:26px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    font-family:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    background-attachment:fixed;
    min-height:100%;
    overflow-x:hidden;
    user-select:none;
  }
  #app{max-width:960px; margin:0 auto; padding:16px 16px 60px; min-height:100vh;}
  .topbar{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  .topbar h1{color:#fff; font-size:clamp(22px,5vw,34px); margin:0; text-shadow:0 3px 0 rgba(0,0,0,.15);}
  .spacer{flex:1;}
  .pill{
    background:rgba(255,255,255,.9); border:none; border-radius:999px; padding:10px 16px;
    font-size:16px; font-weight:800; color:var(--ink); cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.12);
    font-family:inherit;
  }
  .pill:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.12);}
  .stars-pill{background:var(--yellow);}
  .screen-title{color:#fff; text-align:center; font-size:clamp(24px,6vw,40px); margin:8px 0 4px; text-shadow:0 3px 0 rgba(0,0,0,.15);}
  .screen-sub{color:#fff; text-align:center; font-size:clamp(15px,3.5vw,20px); margin:0 0 20px; opacity:.95;}
  .grid{display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(200px,1fr));}
  .card{
    background:var(--card); border-radius:var(--radius); padding:22px 18px; cursor:pointer;
    box-shadow:var(--shadow); text-align:center; transition:transform .08s; position:relative;
    border:4px solid transparent;
  }
  .card:active{transform:translateY(4px) scale(.99);}
  .card .emoji{font-size:52px; line-height:1; display:block; margin-bottom:8px;}
  .card .label{font-size:22px; font-weight:800;}
  .card .desc{font-size:15px; color:var(--muted); margin-top:6px; font-weight:600;}
  .card.locked{opacity:.7; cursor:not-allowed;}
  .card.locked::after{content:"🔒"; position:absolute; top:10px; right:12px; font-size:22px;}
  .tag-soon{position:absolute; top:10px; left:12px; background:var(--yellow); color:var(--ink);
    font-size:12px; font-weight:800; padding:3px 8px; border-radius:999px;}
  .c-pink{border-color:var(--pink);} .c-purple{border-color:var(--purple);}
  .c-blue{border-color:var(--blue);} .c-green{border-color:var(--green);}
  .c-yellow{border-color:var(--yellow);} .c-orange{border-color:var(--orange);}
  .panel{background:var(--card); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); margin-bottom:16px;}
  .panel h2{margin:0 0 8px; font-size:24px;}
  .panel p{font-size:17px; color:var(--muted); line-height:1.5; font-weight:600;}
  .bigbtn{
    display:inline-block; background:var(--green); color:#fff; border:none; border-radius:18px;
    padding:16px 26px; font-size:20px; font-weight:800; cursor:pointer; box-shadow:0 6px 0 rgba(0,0,0,.18);
    font-family:inherit; margin:6px;
  }
  .bigbtn:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.18);}
  .bigbtn.alt{background:var(--purple);} .bigbtn.warn{background:var(--orange);} .bigbtn.mut{background:#b9b4d6;}
  .row{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; align-items:center;}
  .center{text-align:center;}

  /* piano */
  .kb-wrap{overflow-x:auto; padding:10px 0; -webkit-overflow-scrolling:touch;}
  .keyboard{position:relative; display:flex; height:210px; margin:0 auto; width:100%; max-width:900px; justify-content:center; touch-action:none;}
  .wkey{flex:1 1 0; min-width:0; max-width:56px; height:210px; background:linear-gradient(#fff,#f0eefc); border:2px solid #d7d2ef;
    border-radius:0 0 10px 10px; margin:0 1px; display:flex; align-items:flex-end; justify-content:center;
    padding-bottom:10px; font-weight:800; color:#9a94c0; cursor:pointer; position:relative; touch-action:none;}
  .wkey:active,.wkey.on{background:linear-gradient(#ffe9a8,#ffd23f); color:#7a5b00;}
  .bkey{position:absolute; top:0; right:0; transform:translateX(50%); width:62%; height:130px;
    background:linear-gradient(#4a4470,#231f3d); border-radius:0 0 8px 8px; z-index:3; cursor:pointer; touch-action:none;}
  .bkey:active,.bkey.on{background:linear-gradient(#ff8fc0,#ff5ca8);}
  .key-hi{box-shadow:0 0 0 4px var(--green), 0 0 22px var(--green);}
  .bkey.key-hi{box-shadow:0 0 0 4px var(--green), 0 0 22px var(--green);}

  /* guitar */
  .guitar{background:#3a2a18; border-radius:16px; padding:16px; }
  .gstring{height:38px; margin:8px 0; position:relative; cursor:pointer; display:flex; align-items:center; touch-action:none;}
  .gstring .line{flex:1; height:4px; border-radius:4px; background:linear-gradient(90deg,#d9c48a,#f4e6b8);}
  .gstring .lbl{width:34px; color:#f4e6b8; font-weight:800; text-align:center;}
  .gstring.pluck .line{animation:vib .3s;}
  @keyframes vib{0%,100%{transform:scaleY(1);}25%{transform:scaleY(2.6);}75%{transform:scaleY(.5);}}
  .fretboard{background:#2a1c0f; border-radius:12px; padding:14px; color:#fff; display:inline-block;}
  .fret-grid{display:grid; grid-template-columns:repeat(6,34px); gap:0;}
  .fret-cell{width:34px; height:34px; border-right:2px solid #7a5a30; border-bottom:2px solid #7a5a30;
    position:relative;}
  .fret-cell.nut{border-top:6px solid #eee;}
  .dot{width:24px; height:24px; border-radius:50%; background:var(--pink); color:#fff; font-weight:800;
    display:flex; align-items:center; justify-content:center; position:absolute; top:5px; left:5px; font-size:13px;}
  .open-mark{color:#8be28b; font-weight:800;} .mute-mark{color:#ff8a8a; font-weight:800;}

  /* drums */
  .kit{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; max-width:480px; margin:0 auto;}
  .pad{border-radius:20px; padding:30px 10px; text-align:center; color:#fff; font-size:22px; font-weight:800;
    cursor:pointer; box-shadow:0 8px 0 rgba(0,0,0,.25); border:none; font-family:inherit; touch-action:none;}
  .ladder-key{touch-action:none;}
  .pad:active,.pad.hit{transform:translateY(5px) scale(.98); box-shadow:0 3px 0 rgba(0,0,0,.25); filter:brightness(1.25);}
  .pad.kick{background:var(--purple);} .pad.snare{background:var(--pink);}
  .pad.hihat{background:var(--blue);} .pad.crash{background:var(--orange);}

  .bb-grid{display:grid; gap:6px; margin:14px 0; overflow-x:auto;}
  .bb-row{display:grid; grid-template-columns:70px repeat(8,1fr); gap:6px; align-items:center; min-width:420px;}
  .bb-name{font-weight:800; font-size:14px;}
  .bb-cell{aspect-ratio:1; border-radius:10px; background:#eae7fb; cursor:pointer; min-height:34px;}
  .bb-cell.on{background:var(--green);}
  .bb-cell.play{outline:4px solid var(--yellow);}

  .choice{background:var(--card); border:4px solid var(--purple); border-radius:18px; padding:20px;
    font-size:20px; font-weight:800; cursor:pointer; box-shadow:var(--shadow); font-family:inherit; color:var(--ink);}
  .choice:active{transform:translateY(4px);}
  .choice.right{background:var(--green); color:#fff; border-color:var(--green);}
  .choice.wrong{background:var(--red); color:#fff; border-color:var(--red);}
  .scorebar{font-size:20px; font-weight:800; color:#fff; text-align:center; margin:10px 0;}

  .stars{font-size:34px; letter-spacing:4px; text-align:center; margin:10px 0;}
  .tapzone{background:var(--yellow); border-radius:24px; height:180px; display:flex; align-items:center;
    justify-content:center; font-size:26px; font-weight:800; cursor:pointer; box-shadow:var(--shadow); user-select:none;}
  .tapzone:active{filter:brightness(1.1); transform:scale(.99);}
  .beatdot{width:26px;height:26px;border-radius:50%;background:#fff3;display:inline-block;margin:4px;}
  .beatdot.on{background:#fff; box-shadow:0 0 16px #fff;}

  .video-link{display:flex; align-items:center; gap:12px; background:var(--card); border-radius:16px;
    padding:14px; box-shadow:var(--shadow); text-decoration:none; color:var(--ink); font-weight:700; margin-bottom:10px;}
  .video-link .em{font-size:30px;}
  .video-link small{display:block; color:var(--muted); font-weight:600;}

  .confetti{position:fixed; top:-20px; width:12px; height:18px; z-index:999; pointer-events:none; border-radius:3px;}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg); opacity:1;}}
  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:14px 22px; border-radius:16px; font-weight:800; font-size:18px; z-index:1000; box-shadow:var(--shadow);}
  .hidden{display:none;}
</style>
</head>
<body>
<div id="app"></div>

/* ============================================================
   STATE + ROUTER
   ============================================================ */
const STATE = {
  lang:"en", band:null, level:null, instrument:null,
  screen:"who", stack:[],
  progress: loadProgress()
};
function loadProgress(){
  try{ return JSON.parse(localStorage.getItem("ma_progress")||"{}"); }
  catch(e){ return {}; }
}
function saveProgress(){
  try{ localStorage.setItem("ma_progress", JSON.stringify(STATE.progress)); }catch(e){}
}
function totalStars(){ let s=0; for(const k in STATE.progress) s+=STATE.progress[k]; return s; }
function awardStar(key){
  if(!STATE.progress[key]){ STATE.progress[key]=1; saveProgress(); toast(t("star_earned")); return true; }
  return false;
}
function t(key, vars){
  let dict = I18N[STATE.lang] || I18N.en;
  let s = (key in dict) ? dict[key] : (I18N.en[key]!==undefined ? I18N.en[key] : key);
  if(vars){ for(const v in vars){ s = s.replace(new RegExp("\\{"+v+"\\}","g"), vars[v]); } }
  return s;
}
// band-tuned text helper: returns t(base + '_' + bandKey)
function bt(base){
  const map={b1:"_b1",b2:"_b2",b3:"_b3",ad:"_ad"};
  return t(base + (map[STATE.band]||"_b2"));
}

function go(screen, opts){
  STATE.stack.push(STATE.screen);
  STATE.screen = screen;
  if(opts) Object.assign(STATE, opts);
  render();
  window.scrollTo(0,0);
}
function back(){
  if(STATE.stack.length){ STATE.screen = STATE.stack.pop(); render(); window.scrollTo(0,0); }
}
function goHome(){ STATE.stack=[]; STATE.screen="who"; STATE.instrument=null; render(); window.scrollTo(0,0); }

/* small DOM helper */
function el(tag, attrs, children){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==="class") e.className=attrs[k];
    else if(k==="html") e.innerHTML=attrs[k];
    else if(k==="text") e.textContent=attrs[k];
    else if(k.startsWith("on")&&typeof attrs[k]==="function") e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  if(children) (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c==null) return;
    e.appendChild(typeof c==="string"?document.createTextNode(c):c);
  });
  return e;
}

/* ============================================================
   WEB AUDIO ENGINE, all sound synthesized, no files.
   ============================================================ */
let AC=null;
function ensureAudio(){
  if(!AC){ AC = new (window.AudioContext||window.webkitAudioContext)(); }
  if(AC.state==="suspended") AC.resume();
  return AC;
}
const NOTE_FREQ = (function(){
  const names=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  const f={};
  for(let oct=1; oct<=6; oct++){
    for(let i=0;i<12;i++){
      const midi=12*(oct+1)+i;            // C4 = midi 60
      f[names[i]+oct]=440*Math.pow(2,(midi-69)/12);
    }
  }
  return f;
})();
function noteFreq(n){ return NOTE_FREQ[n] || 440; }

function master(gainVal){
  const g=AC.createGain(); g.gain.value=gainVal; g.connect(AC.destination); return g;
}
function playPiano(freq, dur){
  ensureAudio(); dur=dur||1.2;
  const t0=AC.currentTime;
  const g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(0.5,t0+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  const o1=AC.createOscillator(); o1.type="triangle"; o1.frequency.value=freq;
  const o2=AC.createOscillator(); o2.type="sine"; o2.frequency.value=freq*2;
  const g2=AC.createGain(); g2.gain.value=0.3; o2.connect(g2);
  o1.connect(g); g2.connect(g); g.connect(AC.destination);
  o1.start(t0); o2.start(t0); o1.stop(t0+dur); o2.stop(t0+dur);
}
function playGuitar(freq, dur){
  ensureAudio(); dur=dur||1.6;
  const t0=AC.currentTime;
  const g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(0.55,t0+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  const o1=AC.createOscillator(); o1.type="sawtooth"; o1.frequency.value=freq;
  const o2=AC.createOscillator(); o2.type="triangle"; o2.frequency.value=freq;
  const lp=AC.createBiquadFilter(); lp.type="lowpass"; lp.frequency.setValueAtTime(3200,t0);
  lp.frequency.exponentialRampToValueAtTime(700,t0+dur);
  o1.connect(lp); o2.connect(lp); lp.connect(g); g.connect(AC.destination);
  o1.start(t0); o2.start(t0); o1.stop(t0+dur); o2.stop(t0+dur);
}
function playChord(freqs){ freqs.forEach((f,i)=> setTimeout(()=>playGuitar(f,1.8), i*45)); }

let NOISE=null;
function noiseBuffer(){
  if(NOISE) return NOISE;
  const b=AC.createBuffer(1, AC.sampleRate*1, AC.sampleRate);
  const d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  NOISE=b; return b;
}
function playDrum(type){
  ensureAudio(); const t0=AC.currentTime;
  if(type==="kick"){
    const o=AC.createOscillator(); const g=AC.createGain();
    o.frequency.setValueAtTime(150,t0); o.frequency.exponentialRampToValueAtTime(48,t0+0.14);
    g.gain.setValueAtTime(0.9,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.3);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+0.32);
  } else if(type==="snare"){
    const n=AC.createBufferSource(); n.buffer=noiseBuffer();
    const bp=AC.createBiquadFilter(); bp.type="highpass"; bp.frequency.value=1400;
    const g=AC.createGain(); g.gain.setValueAtTime(0.7,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.2);
    n.connect(bp); bp.connect(g); g.connect(AC.destination);
    const o=AC.createOscillator(); o.type="triangle"; o.frequency.value=180;
    const g2=AC.createGain(); g2.gain.setValueAtTime(0.4,t0); g2.gain.exponentialRampToValueAtTime(0.0001,t0+0.12);
    o.connect(g2); g2.connect(AC.destination);
    n.start(t0); n.stop(t0+0.2); o.start(t0); o.stop(t0+0.12);
  } else if(type==="hihat"){
    const n=AC.createBufferSource(); n.buffer=noiseBuffer();
    const hp=AC.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=7000;
    const g=AC.createGain(); g.gain.setValueAtTime(0.4,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.05);
    n.connect(hp); hp.connect(g); g.connect(AC.destination); n.start(t0); n.stop(t0+0.06);
  } else if(type==="crash"){
    const n=AC.createBufferSource(); n.buffer=noiseBuffer();
    const hp=AC.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=5000;
    const g=AC.createGain(); g.gain.setValueAtTime(0.5,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.7);
    n.connect(hp); hp.connect(g); g.connect(AC.destination); n.start(t0); n.stop(t0+0.72);
  }
}

function confetti(){
  const colors=["#ff5ca8","#7c5cff","#39c0ff","#38d39f","#ffd23f","#ff9d3c"];
  for(let i=0;i<40;i++){
    const c=el("div",{class:"confetti"});
    c.style.left=Math.random()*100+"vw";
    c.style.background=colors[i%colors.length];
    c.style.opacity=0;
    c.style.animation="fall "+(1.6+Math.random()*1.4)+"s ease-in "+Math.random()*0.5+"s forwards";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3600);
  }
}
let toastTimer=null;
function toast(msg){
  const old=document.querySelector(".toast"); if(old) old.remove();
  const tEl=el("div",{class:"toast",text:msg});
  document.body.appendChild(tEl);
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>tEl.remove(),1800);
}

/* keyboard: octaves depend on band */
function octaveCount(){ return STATE.band==="b1"?1:2; }
function buildKeyboard(playFn){
  const pf = playFn || ((f)=>playPiano(f));
  const wrap=el("div",{class:"kb-wrap"});
  const kb=el("div",{class:"keyboard"});
  const whites=["C","D","E","F","G","A","B"];
  const blackAfter={"C":"C#","D":"D#","F":"F#","G":"G#","A":"A#"};
  const startOct=4, octs=octaveCount();
  for(let o=0;o<octs;o++){
    for(const w of whites){
      const noteName=w+(startOct+o);
      const key=el("div",{class:"wkey",text:w,"data-note":noteName});
      key.addEventListener("pointerdown",()=>{ pf(noteFreq(noteName)); flash(key); });
      if(blackAfter[w]){
        const bn=blackAfter[w]+(startOct+o);
        const bk=el("div",{class:"bkey","data-note":bn});
        bk.addEventListener("pointerdown",(e)=>{ e.stopPropagation(); pf(noteFreq(bn)); flash(bk); });
        key.appendChild(bk);   // black key anchored to its white key via CSS (no JS measurement)
      }
      kb.appendChild(key);
    }
  }
  const topC="C"+(startOct+octs);
  const tk=el("div",{class:"wkey",text:"C","data-note":topC});
  tk.addEventListener("pointerdown",()=>{ pf(noteFreq(topC)); flash(tk); });
  kb.appendChild(tk);
  wrap.appendChild(kb);
  return wrap;
}
function flash(k){ k.classList.add("on"); setTimeout(()=>k.classList.remove("on"),160); }

/* guitar */
const GUITAR_STRINGS=[ // low to high
  {lbl:"E",f:82.41},{lbl:"A",f:110.00},{lbl:"D",f:146.83},
  {lbl:"G",f:196.00},{lbl:"B",f:246.94},{lbl:"e",f:329.63}
];
function buildGuitar(withStrum){
  const box=el("div",{class:"guitar"});
  const strings=[];
  GUITAR_STRINGS.slice().reverse().forEach(s=>{
    const row=el("div",{class:"gstring"},[
      el("div",{class:"lbl",text:s.lbl}),
      el("div",{class:"line"})
    ]);
    row.addEventListener("pointerdown",()=>{ playGuitar(s.f); row.classList.remove("pluck"); void row.offsetWidth; row.classList.add("pluck"); });
    box.appendChild(row); strings.push({s,row});
  });
  if(withStrum){
    const strum=el("div",{class:"center",style:"margin-top:12px"},[
      el("button",{class:"bigbtn warn",text:"🎸 "+t("strum"),onclick:()=>{
        GUITAR_STRINGS.forEach((s,i)=>setTimeout(()=>{ playGuitar(s.f); const r=strings[GUITAR_STRINGS.length-1-i].row; r.classList.remove("pluck"); void r.offsetWidth; r.classList.add("pluck"); },i*55));
      }})
    ]);
    box.appendChild(strum);
  }
  return box;
}

let songKeyEls={};
function playSongScreen(id){
  clear();
  const song=SONGS[id];
  app().appendChild(topbar(true));
  app().appendChild(el("div",{class:"screen-title",text:"🎵 "+song.name()}));
  const kbWrap=buildSongKeyboard(song);
  app().appendChild(kbWrap);
  const status=el("div",{class:"screen-sub",text:t("song_yourturn")});
  app().appendChild(status);
  app().appendChild(el("div",{class:"row"},[
    el("button",{class:"bigbtn alt",text:"👀 "+t("song_watch"),onclick:()=>watchSong(song,status)}),
  ]));
  // your-turn tracking
  songProgressIdx=0; songTarget=song; songStatusEl=status;
  highlightNext();

let songProgressIdx=0, songTarget=null, songStatusEl=null;
function buildSongKeyboard(song){
  // build a keyboard covering needed notes
  const wrap=el("div",{class:"kb-wrap"});
  const kb=el("div",{class:"keyboard"});
  const whites=["C","D","E","F","G","A","B"];
  const blackAfter={"C":"C#","D":"D#","F":"F#","G":"G#","A":"A#"};
  const octs=2, startOct=4;
  songKeyEls={};
  for(let o=0;o<octs;o++){
    for(const w of whites){
      const nn=w+(startOct+o);
      const key=el("div",{class:"wkey",text:w,"data-note":nn});
      key.addEventListener("pointerdown",()=>onSongKey(nn,key));
      songKeyEls[nn]=key;
      if(blackAfter[w]){
        const bn=blackAfter[w]+(startOct+o);
        const bk=el("div",{class:"bkey","data-note":bn});
        bk.addEventListener("pointerdown",(e)=>{e.stopPropagation(); onSongKey(bn,bk);});
        songKeyEls[bn]=bk;
        key.appendChild(bk);   // black key anchored to its white key via CSS
      }
      kb.appendChild(key);
    }
  }
  const topC="C"+(startOct+octs);
  const tk=el("div",{class:"wkey",text:"C","data-note":topC});
  tk.addEventListener("pointerdown",()=>onSongKey(topC,tk));
  songKeyEls[topC]=tk;
  kb.appendChild(tk);
  wrap.appendChild(kb);
  return wrap;
}
function watchSong(song,status){
  clearHighlights();
  status.textContent=t("song_watch")+"…";
  song.notes.forEach((n,i)=>{
    setTimeout(()=>{
      playMelody(noteFreq(n));
      const k=songKeyEls[n]; if(k){ k.classList.add("on"); setTimeout(()=>k.classList.remove("on"),260); }
      if(i===song.notes.length-1){ setTimeout(()=>{ status.textContent=t("song_yourturn"); songProgressIdx=0; highlightNext(); },400); }
    }, i*420);
  });
}
function clearHighlights(){ for(const k in songKeyEls) songKeyEls[k].classList.remove("key-hi"); }
function highlightNext(){
  clearHighlights();
  if(!songTarget) return;
  if(songProgressIdx>=songTarget.notes.length){
    songStatusEl.textContent=t("song_welldone"); confetti(); awardStar(STATE.instrument+"_song_"+ (Object.keys(SONGS).find(k=>SONGS[k]===songTarget)) );
    return;
  }
  const n=songTarget.notes[songProgressIdx];
  const k=songKeyEls[n]; if(k) k.classList.add("key-hi");
}
function onSongKey(note,key){
  playMelody(noteFreq(note)); flash(key);
  if(songTarget && note===songTarget.notes[songProgressIdx]){
    songProgressIdx++; highlightNext();
  }
}

  });
  app().appendChild(kit);

    el("button",{class:"bigbtn",text:t("echo_listen"),onclick:()=>echoPlay(status)})
  ]));
  echoRound=1; echoNewSeq(status);
}
function echoNewSeq(status){
  const types=["kick","snare","hihat","crash"];
  echoSeq=[]; const len=echoRound+1;
  for(let i=0;i<len;i++) echoSeq.push(types[Math.floor(Math.random()*3)]); // avoid crash for clarity mostly
  echoInput=[]; status.textContent=t("echo_round",{n:echoRound});
  setTimeout(()=>echoPlay(status),500);
}
function echoPlay(status){
  echoInput=[]; status.textContent="👂…";
  echoSeq.forEach((type,i)=>{
    setTimeout(()=>{ playDrum(type); const p=echoPads[type]; p.classList.add("hit"); setTimeout(()=>p.classList.remove("hit"),160);
      if(i===echoSeq.length-1) setTimeout(()=>status.textContent=t("echo_yourturn"),300);
    }, i*520);
  });
}
function echoTap(type,pad,status){
  playDrum(type); pad.classList.add("hit"); setTimeout(()=>pad.classList.remove("hit"),110);
  echoInput.push(type);
  const idx=echoInput.length-1;
  if(echoSeq[idx]!==type){ status.textContent=t("echo_wrong"); echoInput=[]; setTimeout(()=>echoPlay(status),800); return; }
  if(echoInput.length===echoSeq.length){
    status.textContent=t("echo_right"); confetti(); awardStar("drums_echo");
    echoRound++; setTimeout(()=>echoNewSeq(status),1000);
  }
}

function rhythmConfig(){
  if(STATE.band==="b1") return {tempo:90,beats:4};
  if(STATE.band==="b2") return {tempo:110,beats:8};
  return {tempo:130,beats:8};
}
let rhythmData=null;
function actRhythm(){
  app().appendChild(topbar(true));
  app().appendChild(el("div",{class:"screen-title",text:"👏 "+t("act_rhythm")}));
  app().appendChild(el("div",{class:"screen-sub",text:t("rhythm_intro")}));
  const cfg=rhythmConfig();
  const dots=el("div",{class:"center",style:"margin:10px"});
  const dotEls=[];
  for(let i=0;i<cfg.beats;i++){ const d=el("span",{class:"beatdot"}); dots.appendChild(d); dotEls.push(d); }
  app().appendChild(dots);
  const status=el("div",{class:"scorebar",text:""});
  app().appendChild(status);
  const zone=el("div",{class:"tapzone",text:t("rhythm_tap")});
  app().appendChild(zone);
  app().appendChild(el("div",{class:"row",style:"margin-top:14px"},[
    el("button",{class:"bigbtn",text:t("rhythm_start"),onclick:()=>runRhythm(cfg,dotEls,zone,status)})
  ]));
}
function runRhythm(cfg,dotEls,zone,status){
  ensureAudio();
  const beatMs=60000/cfg.tempo;
  const beatTimes=[]; const now=performance.now();
  let taps=[]; rhythmData={beatTimes,taps,window:beatMs*0.4};
  const startDelay=800;
  for(let i=0;i<cfg.beats;i++){
    const bt=startDelay + i*beatMs;
    beatTimes.push(now+bt);
    setTimeout(()=>{ playDrum("hihat"); dotEls[i].classList.add("on"); setTimeout(()=>dotEls[i].classList.remove("on"),160); }, bt);
  }
  const tapHandler=()=>{ rhythmData.taps.push(performance.now()); zone.style.filter="brightness(1.15)"; setTimeout(()=>zone.style.filter="",100); };
  zone.onpointerdown=tapHandler;
  setTimeout(()=>{
    zone.onpointerdown=null;
    // score: each beat matched by nearest tap within window
    let hits=0; const used=new Set();
    beatTimes.forEach(bt=>{
      let best=-1,bestd=1e9;
      rhythmData.taps.forEach((tp,idx)=>{ if(used.has(idx))return; const d=Math.abs(tp-bt); if(d<bestd){bestd=d;best=idx;} });
      if(best>=0 && bestd<=rhythmData.window){ hits++; used.add(best); }
    });
    status.textContent=t("rhythm_result",{n:hits,t:cfg.beats});
    if(hits>=Math.ceil(cfg.beats*0.6)){ confetti(); awardStar(STATE.instrument+"_rhythm"); }
  }, startDelay + cfg.beats*beatMs + beatMs);
}

  const tabEl=el("div",{class:"panel",style:"font-family:monospace;font-size:20px;overflow-x:auto"});
  const renderTab=()=>{
    tabEl.innerHTML="";
    for(let str=5;str>=0;str--){
      let line=names[str]+" |";
      seq.forEach((s,i)=>{ line += (s===str? (i===pos?"[0]":" 0 ") : " - ") ; });
      tabEl.appendChild(el("div",{text:line}));
    }
  };
  renderTab();
  app().appendChild(tabEl);
  const guitar=buildGuitar(false);
  app().appendChild(guitar);
  // override string taps to check order
  const rows=guitar.querySelectorAll(".gstring");
  // rows are high->low (reversed). map displayed row index to string index:
  rows.forEach((row,dispIdx)=>{
    const stringIdx=5-dispIdx; // because reversed
    row.onpointerdown=()=>{
      playGuitar(GUITAR_STRINGS[stringIdx].f); row.classList.remove("pluck"); void row.offsetWidth; row.classList.add("pluck");
      if(seq[pos]===stringIdx){ pos++; renderTab();
        if(pos>=seq.length){ toast(t("tab_done")); confetti(); awardStar("guitar_tab"); pos=0; setTimeout(renderTab,1200); }
      }
    };
  });
}

<script>
"use strict";
/* ============================================================
   PHASE 2, MORE INSTRUMENTS (ukulele, keyboard/synth, singing)
   Shares global scope with the main script. All strings added to
   the same i18n dictionary; all sound synthesized; NO microphone.

/* ---- i18n additions (same dictionary, keys stay identical for HI later) ---- */
Object.assign(I18N.en, {
  play_uku_hint:"Tap a string, or hit STRUM!",
  play_synth_hint:"Pick a sound, then play the keys!",

  warmup_play:"▶ Hear the whole ladder",

  copy_listen:"🔊 Hear it again",

  copy_did:"I sang it! ⭐",
  copy_round:"Tune {n}",
  chord_am:"A minor", chord_f:"F major",
  uke_song_intro:"Strum on every beat! Tap STRUM to play each chord in order.",
  uke_song_done:"You strummed the whole song! 🌟",
  uke_next_chord:"Next: {c}",
  voice_privacy:"🔒 Nothing is recorded. Just sing and have fun!"
});

/* ---- audio: new voices ---- */
let CURRENT_VOICE = "bells";
function playSynth(freq, voice, dur){
  ensureAudio();
  voice = voice || "piano";
  if(voice==="piano") return playPiano(freq, dur);
  const t0=AC.currentTime;
  dur = dur || (voice==="bells"?2.2 : voice==="space"?1.8 : 1.0);
  const g=AC.createGain();
  const attack = voice==="space"?0.12:0.006;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(0.4,t0+attack);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  const oscs=[];
  if(voice==="bells"){
    const o1=AC.createOscillator(); o1.type="sine"; o1.frequency.value=freq;
    const o2=AC.createOscillator(); o2.type="sine"; o2.frequency.value=freq*3.01;
    const g2=AC.createGain(); g2.gain.value=0.25; o2.connect(g2);
    o1.connect(g); g2.connect(g); oscs.push(o1,o2);
  } else if(voice==="space"){
    const o1=AC.createOscillator(); o1.type="sawtooth"; o1.frequency.value=freq*0.995;
    const o2=AC.createOscillator(); o2.type="sawtooth"; o2.frequency.value=freq*1.005;
    const lp=AC.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=1500;
    o1.connect(lp); o2.connect(lp); lp.connect(g); oscs.push(o1,o2);
  } else { // robot
    const o1=AC.createOscillator(); o1.type="square"; o1.frequency.value=freq;
    const lfo=AC.createOscillator(); lfo.type="sine"; lfo.frequency.value=7;
    const lg=AC.createGain(); lg.gain.value=freq*0.02; lfo.connect(lg); lg.connect(o1.frequency);
    o1.connect(g); oscs.push(o1,lfo);
  }
  g.connect(AC.destination);
  oscs.forEach(o=>{ o.start(t0); o.stop(t0+dur); });
}
function playUke(freq, dur){
  ensureAudio(); dur=dur||1.0; const t0=AC.currentTime;
  const g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(0.5,t0+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  const o1=AC.createOscillator(); o1.type="triangle"; o1.frequency.value=freq;
  const o2=AC.createOscillator(); o2.type="square"; o2.frequency.value=freq;
  const g2=AC.createGain(); g2.gain.value=0.16; o2.connect(g2);
  const lp=AC.createBiquadFilter(); lp.type="lowpass"; lp.frequency.setValueAtTime(4500,t0);
  lp.frequency.exponentialRampToValueAtTime(1200,t0+dur);
  o1.connect(lp); g2.connect(lp); lp.connect(g); g.connect(AC.destination);
  o1.start(t0); o2.start(t0); o1.stop(t0+dur); o2.stop(t0+dur);
}
function playUkeChord(freqs){ freqs.forEach((f,i)=>setTimeout(()=>playUke(f,1.3), i*40)); }
function playVoice(freq, dur){
  ensureAudio(); dur=dur||1.1; const t0=AC.currentTime;
  const src=AC.createOscillator(); src.type="sawtooth"; src.frequency.value=freq;
  const lfo=AC.createOscillator(); lfo.type="sine"; lfo.frequency.value=5.5;
  const lg=AC.createGain(); lg.gain.value=freq*0.007; lfo.connect(lg); lg.connect(src.frequency);
  const f1=AC.createBiquadFilter(); f1.type="bandpass"; f1.frequency.value=730; f1.Q.value=8;
  const f2=AC.createBiquadFilter(); f2.type="bandpass"; f2.frequency.value=1090; f2.Q.value=10;
  const g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(0.5,t0+0.06);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  src.connect(f1); src.connect(f2); f1.connect(g); f2.connect(g); g.connect(AC.destination);
  src.start(t0); lfo.start(t0); src.stop(t0+dur); lfo.stop(t0+dur);
}
function playMelody(freq){
  if(STATE.instrument==="synth") return playSynth(freq, CURRENT_VOICE);
  return playPiano(freq);
}

/* ---- data ---- */
const UKE_CHORDS={ // string order g,C,E,A ; shape=[fret,finger]
  c:{name:()=>t("chord_c"),  shape:[[0,0],[0,0],[0,0],[3,3]], freqs:[392.00,261.63,329.63,523.25]},
  am:{name:()=>t("chord_am"), shape:[[2,2],[0,0],[0,0],[0,0]], freqs:[440.00,261.63,329.63,440.00]},
  f:{name:()=>t("chord_f"),  shape:[[2,2],[0,0],[1,1],[0,0]], freqs:[440.00,261.63,349.23,440.00]}
};
function chordSet(){
  if(STATE.instrument==="uku") return {list:["c","am","f"], map:UKE_CHORDS};
  return {list:["em","g","c"], map:CHORDS};
}
const VOICE_LADDER=[
  {s:"Do",n:"C4"},{s:"Re",n:"D4"},{s:"Mi",n:"E4"},{s:"Fa",n:"F4"},
  {s:"Sol",n:"G4"},{s:"La",n:"A4"},{s:"Ti",n:"B4"},{s:"Do",n:"C5"}
];

/* ---- builders ---- */
function buildUke(withStrum){
  const rows=[{lbl:"A",f:440.00},{lbl:"E",f:329.63},{lbl:"C",f:261.63},{lbl:"g",f:392.00}]; // top->bottom
  const box=el("div",{class:"guitar"});
  const refs=[];
  rows.forEach(s=>{
    const row=el("div",{class:"gstring"},[el("div",{class:"lbl",text:s.lbl}),el("div",{class:"line"})]);
    row.addEventListener("pointerdown",()=>{ playUke(s.f); row.classList.remove("pluck"); void row.offsetWidth; row.classList.add("pluck"); });
    box.appendChild(row); refs.push(row);
  });
  if(withStrum){
    box.appendChild(el("div",{class:"center",style:"margin-top:12px"},[
      el("button",{class:"bigbtn warn",text:"🪕 "+t("strum"),onclick:()=>{
        [3,2,1,0].forEach((idx,i)=>setTimeout(()=>{ playUke(rows[idx].f); const r=refs[idx]; r.classList.remove("pluck"); void r.offsetWidth; r.classList.add("pluck"); }, i*55));
      }})
    ]));
  }
  return box;
}
function buildSynthFreePlay(){
  const wrap=el("div",{});
  wrap.appendChild(el("div",{class:"screen-sub",text:t("act_sound_pick")}));
  const picker=el("div",{class:"row",style:"margin-bottom:8px"});

  [["piano",t("sound_piano")],["bells",t("sound_bells")],["space",t("sound_space")],["robot",t("sound_robot")]].forEach(([v,label])=>{
    const b=el("button",{class:"pill",text:label});

    btns[v]=b; picker.appendChild(b);
  });
  wrap.appendChild(picker);
  wrap.appendChild(buildKeyboard((f)=>playSynth(f, CURRENT_VOICE)));

}
function buildVoiceLadder(){
  const wrap=el("div",{class:"center"});
  const ladder=el("div",{style:"display:flex;flex-direction:column-reverse;gap:8px;max-width:340px;margin:0 auto;"});
  VOICE_LADDER.forEach((step,i)=>{
    const b=el("button",{class:"bigbtn ladder-key",style:"width:100%;background:hsl("+(i*32)+",72%,55%)",text:step.s});
    b.addEventListener("pointerdown",()=>{ playVoice(noteFreq(step.n),0.7); b.style.filter="brightness(1.25)"; setTimeout(()=>b.style.filter="",150); });
    ladder.appendChild(b);
  });
  wrap.appendChild(ladder);
  wrap.appendChild(el("div",{class:"row",style:"margin-top:12px"},[
    el("button",{class:"bigbtn alt",text:t("warmup_play"),onclick:()=>{
      VOICE_LADDER.forEach((step,i)=>setTimeout(()=>playVoice(noteFreq(step.n),0.45), i*450));
    }})
  ]));
  wrap.appendChild(el("div",{class:"screen-sub",style:"color:var(--muted);margin-top:10px",text:t("voice_privacy")}));
  return wrap;
}

function ukeSongScreen(){
  clear();
  app().appendChild(topbar(true));
  app().appendChild(el("div",{class:"screen-title",text:"🎼 "+t("act_songs")}));
  app().appendChild(el("div",{class:"screen-sub",text:t("uke_song_intro")}));
  const seq=["c","am","f","c"];
  let pos=0;
  const status=el("div",{class:"scorebar"});

  const nextLbl=el("div",{class:"screen-sub"});
  const renderStep=()=>{
    diagram.innerHTML="";

    const ch=UKE_CHORDS[seq[pos]];

    status.textContent=(pos+1)+" / "+seq.length;
    nextLbl.textContent = (pos+1<seq.length) ? t("uke_next_chord",{c:UKE_CHORDS[seq[pos+1]].name()}) : "";
  };
  renderStep();
  app().appendChild(status);
  app().appendChild(diagram);
  app().appendChild(nextLbl);
  app().appendChild(el("div",{class:"row",style:"margin-top:14px"},[
    el("button",{class:"bigbtn warn",text:"🪕 "+t("strum"),onclick:()=>{
      if(pos>=seq.length){ pos=0; renderStep(); return; }
      const ch=UKE_CHORDS[seq[pos]]; playUkeChord(ch.freqs.filter(f=>f>0)); pos++; renderStep();
    }})
  ]));
}
function actWarmup(){
  app().appendChild(topbar(true));
  app().appendChild(el("div",{class:"screen-title",text:"🎶 "+t("act_warmup")}));
  app().appendChild(el("div",{class:"screen-sub",text:t("warmup_intro")}));
  app().appendChild(buildVoiceLadder());

}
let copyRound=1, copySeq=[];
function actCopy(){ copyRound=1; copyNewTune(); }
function copyNewTune(){
  clear();
  app().appendChild(topbar(true));
  app().appendChild(el("div",{class:"screen-title",text:"🔁 "+t("act_copy")}));
  app().appendChild(el("div",{class:"scorebar",text:t("copy_round",{n:copyRound})}));
  app().appendChild(el("div",{class:"screen-sub",text:t("copy_intro")}));
  const len=Math.min(2+copyRound,6);
  copySeq=[];
  for(let i=0;i<len;i++) copySeq.push(VOICE_LADDER[Math.floor(Math.random()*VOICE_LADDER.length)]);
  const disp=el("div",{class:"stars",style:"font-size:26px;min-height:34px"});
  const renderDisp=(hi)=>{ disp.innerHTML=""; copySeq.forEach((st,i)=>{ disp.appendChild(el("span",{style:"margin:0 6px;"+(i===hi?"color:var(--pink)":""),text:st.s})); }); };
  renderDisp(-1);
  const playTune=()=>{ copySeq.forEach((st,i)=>setTimeout(()=>{ playVoice(noteFreq(st.n),0.5); renderDisp(i); if(i===copySeq.length-1) setTimeout(()=>renderDisp(-1),400); }, i*550)); };
  app().appendChild(disp);
  app().appendChild(el("div",{class:"row"},[ el("button",{class:"bigbtn alt",text:t("copy_listen"),onclick:playTune}) ]));
  app().appendChild(el("div",{class:"screen-sub",style:"margin-top:14px",text:t("copy_youtry")}));
  app().appendChild(el("div",{class:"row"},[
    el("button",{class:"bigbtn",text:t("copy_did"),onclick:()=>{ confetti(); awardStar("voice_copy"); copyRound++; setTimeout(copyNewTune,900); }})
  ]));
  app().appendChild(el("div",{class:"screen-sub",style:"color:var(--muted);margin-top:10px",text:t("voice_privacy")}));
  setTimeout(playTune,500);
}

<script>
"use strict";
/* ============================================================
   SWIPE / GLISSANDO
   Drag a finger (or mouse) across strings, keys, pads or the
   singing ladder and each one sounds as you pass over it — no
   need to lift between notes. It reuses each surface's existing
   tap action by re-dispatching a pointerdown on the newly
   entered surface, so it works for every instrument at once.
   touch-action:none on those surfaces (set in CSS) stops the
   drag from scrolling so the notes play instead.
   ============================================================ */
(function(){
  var down=false, prev=null;
  var CLS=["wkey","bkey","gstring","pad","ladder-key"];
  function surface(node){
    var n=node;
    while(n && n.classList){
      for(var i=0;i<CLS.length;i++){ if(n.classList.contains(CLS[i])) return n; }
      n=n.parentElement;
    }
    return null;
  }
  function fire(el){
    try{ el.dispatchEvent(new PointerEvent("pointerdown",{bubbles:true,cancelable:true})); }
    catch(err){ el.dispatchEvent(new Event("pointerdown",{bubbles:true})); }
  }
  document.addEventListener("pointerdown", function(e){
    var el=surface(e.target);
    if(el){ down=true; prev=el; }   // first note already sounds via the element's own handler
  }, true);
  document.addEventListener("pointermove", function(e){
    if(!down) return;
    var t=document.elementFromPoint(e.clientX, e.clientY);
    var el=surface(t);
    if(el && el!==prev){ prev=el; fire(el); }
  }, {passive:true});
  function end(){ down=false; prev=null; }
  ["pointerup","pointercancel","pointerleave"].forEach(function(ev){
    document.addEventListener(ev, end, true);
  });
})();
</script>
